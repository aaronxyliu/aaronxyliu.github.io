<!-- Site-specific favicons. The version suffix refreshes aggressively cached PWA icons. -->
{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg?v=3">
<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-96x96.png?v=3" sizes="96x96">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png?v=3">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest?v=3">
{% endif %}
